group=com.citi.gradle-plugins.helm
version=2.2.0

# Optimize for 96 cores (using 75% of cores)
test.maxParallelForks=72
org.gradle.workers.max=72
org.gradle.parallel.threads=72

github.url=https://github.com/citi/gradle-helm-plugin

# Enable all performance features
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=true

# Optimize JVM for high-core-count machine
# org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:ParallelGCThreads=72 -XX:+UseNUMA -XX:+AlwaysPreTouch
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:ParallelGCThreads=6 -XX:+UseNUMA -XX:+AlwaysPreTouch
