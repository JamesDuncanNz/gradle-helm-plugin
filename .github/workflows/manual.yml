name: Manual Build

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK version to use'
        required: true
        default: '17'
        type: choice
        options:
          - '8'
          - '11'
          - '17'
      gradle_task:
        description: 'Gradle task to run'
        required: true
        default: 'build'
        type: string

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: ${{ github.event.inputs.jdk_version }}
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Build with Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          gradle-home-cache-cleanup: true
          arguments: ${{ github.event.inputs.gradle_task }} --stacktrace --info --build-cache --parallel --configuration-cache --daemon --max-workers=72 -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:ParallelGCThreads=72" -Dorg.gradle.workers.max=72 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true